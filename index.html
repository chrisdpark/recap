<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liberty recap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,600&family=Outfit:wght@320;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1714;
      --muted: #6d645a;
      --paper: #f4eee4;
      --card: #fffaf3;
      --line: #e4d9c8;
      --navy: #1c3a57;
      --gold: #b0893e;
      --good: #2f6b4f;
      --warn: #9a3b2f;
      --soft: #dbe6df;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #efe4d0 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 0%, #dfe8e3 0%, transparent 50%),
        var(--paper);
      color: var(--ink);
      letter-spacing: 0.01em;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 36px 22px 72px; }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin: 0 0 8px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 480;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 0.95;
      margin: 0;
      color: var(--navy);
    }
    .updated { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .switcher { position: relative; min-width: 210px; }
    .switcher label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    select {
      appearance: none;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 12px 42px 12px 18px;
      font: 500 16px Outfit, sans-serif;
      color: var(--navy);
      box-shadow: 0 8px 24px rgba(28, 58, 87, 0.06);
      cursor: pointer;
    }
    .switcher::after {
      content: "";
      position: absolute;
      right: 18px;
      bottom: 16px;
      width: 8px; height: 8px;
      border-right: 2px solid var(--navy);
      border-bottom: 2px solid var(--navy);
      transform: rotate(45deg);
      pointer-events: none;
    }
    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 28px; margin-top: 32px; }
    @media (max-width: 840px) {
      header, .layout { display: block; }
      .switcher { margin-top: 22px; }
    }
    .panel, .course {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .panel { padding: 22px; height: fit-content; }
    .panel h2, .courses h2 {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px;
      font-weight: 600;
    }
    .attention { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .attention li {
      padding: 12px 12px 12px 14px;
      border-left: 3px solid var(--gold);
      background: #fbf6ec;
      border-radius: 0 10px 10px 0;
      font-size: 14px;
      line-height: 1.45;
    }
    .quiet { color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .course { padding: 18px 18px 16px; display: flex; flex-direction: column; min-height: 168px; }
    .course-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .grade {
      font-family: Fraunces, Georgia, serif;
      font-size: 34px;
      line-height: 1;
      color: var(--navy);
    }
    .grade.warn { color: var(--warn); }
    .grade.good { color: var(--good); }
    .grade.none { color: var(--muted); font-size: 28px; }
    .chip {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
    }
    .chip.ethos { background: #eef3f0; color: var(--good); border-color: var(--soft); }
    .name { font-weight: 600; margin: 16px 0 2px; font-size: 16px; }
    .meta { color: var(--muted); font-size: 13px; margin: 0 0 auto; }
    .next { margin-top: 14px; font-size: 13px; color: var(--ink); }
    footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="kicker">Liberty Christian</p>
        <h1 id="studentName">Olen</h1>
        <p class="updated" id="updated"></p>
      </div>
      <div class="switcher">
        <label for="who">Student</label>
        <select id="who">
          <option value="olen">Olen</option>
          <option value="sky">Sky</option>
        </select>
      </div>
    </header>
    <div class="layout">
      <aside class="panel">
        <h2>Needs attention</h2>
        <ul class="attention" id="attention"></ul>
      </aside>
      <section>
        <div class="courses">
          <h2>Courses</h2>
          <div class="grid" id="courses"></div>
        </div>
      </section>
    </div>
    <footer>Snapshot from the family recap. First names only. Grades are current as of the timestamp above.</footer>
  </div>
  <script>
    const DATA = {
      updated: "Monday, Aug 31, 2026 · 5:00 PM CT",
      students: {
        olen: {
          name: "Olen",
          attention: [
            "Algebra I is at 37% after the 1.1–1.4 quiz posted at 2/20.",
            "World Geography still has no posted current grade."
          ],
          courses: [
            { name: "Bible", teacher: "Arredondo", period: "P2", source: "Canvas", grade: 100, note: "On track" },
            { name: "Worship Culture", teacher: "Titus", period: "P3", source: "Canvas", grade: null, note: "No posted grade yet" },
            { name: "Algebra I", teacher: "Seegers", period: "P4", source: "Canvas", grade: 37, note: "Quiz 1.1–1.4 was 2/20" },
            { name: "German I", teacher: "Porter", period: "P5", source: "Canvas", grade: 97.5, note: "On track" },
            { name: "World Geography", teacher: "Callahan", period: "P6", source: "Canvas", grade: null, note: "No posted grade yet" },
            { name: "Biology", teacher: "DeGrenier", period: "P7", source: "Canvas", grade: 80.75, note: "Identifying Variables was pending review" },
            { name: "English I", teacher: "MacAllister", period: "P8", source: "Canvas", grade: 97.5, note: "SKDM Reflection 100 · Membean Program 1 95" }
          ]
        },
        sky: {
          name: "Sky",
          attention: [
            "English 12 is at 0% — Death of a Moth scored 0, and several items are missing including the final narrative.",
            "Precalculus is at 40% because Quiz 1.1–1.3 is posted as 0."
          ],
          courses: [
            { name: "English 12", teacher: "Denton", period: "Ethos", source: "Ethos", grade: 0, note: "Final narrative was due today" },
            { name: "Physics", teacher: "Manley", period: "Ethos", source: "Ethos", grade: 100, note: "On track" },
            { name: "Government", teacher: "Daniels", period: "Ethos", source: "Ethos", grade: 100, note: "On track" },
            { name: "Precalculus", teacher: "Pinson", period: "Ethos", source: "Ethos", grade: 40, note: "Quiz 1.1–1.3 posted 0" },
            { name: "Sociology", teacher: "Lane", period: "Ethos", source: "Ethos", grade: null, note: "No posted grade yet" },
            { name: "Apologetics", teacher: "Dallas", period: "P3", source: "Canvas", grade: 100, note: "Post-survey due Fri Sep 4" },
            { name: "Graphic Design", teacher: "Graham", period: "P5", source: "Canvas", grade: null, note: "No assignments posted" }
          ]
        }
      }
    };

    const who = document.getElementById("who");
    const nameEl = document.getElementById("studentName");
    const updated = document.getElementById("updated");
    const attention = document.getElementById("attention");
    const courses = document.getElementById("courses");
    updated.textContent = "Updated " + DATA.updated;

    function gradeClass(g) {
      if (g === null || g === undefined) return "none";
      if (g < 70) return "warn";
      if (g >= 90) return "good";
      return "";
    }
    function gradeLabel(g) {
      if (g === null || g === undefined) return "—";
      return (Number.isInteger(g) ? g : g.toFixed(2).replace(/0$/, "")) + "%";
    }
    function render(key) {
      const s = DATA.students[key];
      nameEl.textContent = s.name;
      attention.innerHTML = s.attention.map(t => "<li>" + t + "</li>").join("") || "<li class='quiet'>Nothing flagged.</li>";
      courses.innerHTML = s.courses.map(c => `
        <article class="course">
          <div class="course-top">
            <div class="grade ${gradeClass(c.grade)}">${gradeLabel(c.grade)}</div>
            <span class="chip ${c.source === "Ethos" ? "ethos" : ""}">${c.source}</span>
          </div>
          <p class="name">${c.name}</p>
          <p class="meta">${c.period} · ${c.teacher}</p>
          <p class="next">${c.note}</p>
        </article>
      `).join("");
    }
    function fromHash() {
      const h = (location.hash || "#olen").replace("#", "");
      return DATA.students[h] ? h : "olen";
    }
    who.value = fromHash();
    render(who.value);
    who.addEventListener("change", () => {
      location.hash = who.value;
      render(who.value);
    });
    window.addEventListener("hashchange", () => {
      who.value = fromHash();
      render(who.value);
    });
  </script>
</body>
</html>
