<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,600&family=Outfit:wght@320;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1714;
      --muted: #6d645a;
      --paper: #f4eee4;
      --card: #fffaf3;
      --line: #e4d9c8;
      --navy: #1c3a57;
      --gold: #b0893e;
      --good: #2f6b4f;
      --warn: #9a3b2f;
      --soft: #dbe6df;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #efe4d0 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 0%, #dfe8e3 0%, transparent 50%),
        var(--paper);
      color: var(--ink);
      letter-spacing: 0.01em;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 36px 22px 72px; }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin: 0 0 8px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 480;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 0.95;
      margin: 0;
      color: var(--navy);
    }
    .updated { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .switcher { position: relative; min-width: 210px; }
    .switcher label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    select {
      appearance: none;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 12px 42px 12px 18px;
      font: 500 16px Outfit, sans-serif;
      color: var(--navy);
      box-shadow: 0 8px 24px rgba(28, 58, 87, 0.06);
      cursor: pointer;
    }
    .switcher::after {
      content: "";
      position: absolute;
      right: 18px;
      bottom: 16px;
      width: 8px; height: 8px;
      border-right: 2px solid var(--navy);
      border-bottom: 2px solid var(--navy);
      transform: rotate(45deg);
      pointer-events: none;
    }
    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 28px; margin-top: 32px; }
    @media (max-width: 840px) {
      header, .layout { display: block; }
      .switcher { margin-top: 22px; }
    }
    .panel, .course, .class-block {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .panel { padding: 22px; height: fit-content; }
    .panel h2, .courses h2, .work h2 {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px;
      font-weight: 600;
    }
    .attention { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .attention li {
      padding: 12px 12px 12px 14px;
      border-left: 3px solid var(--gold);
      background: #fbf6ec;
      border-radius: 0 10px 10px 0;
      font-size: 14px;
      line-height: 1.45;
    }
    .quiet { color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .course { padding: 18px 18px 16px; display: flex; flex-direction: column; min-height: 168px; }
    .course-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .grade {
      font-family: Fraunces, Georgia, serif;
      font-size: 34px;
      line-height: 1;
      color: var(--navy);
    }
    .grade.warn { color: var(--warn); }
    .grade.good { color: var(--good); }
    .grade.none { color: var(--muted); font-size: 28px; }
    .chip {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
    }
    .chip.ethos { background: #eef3f0; color: var(--good); border-color: var(--soft); }
    .chip.overdue, .chip.zero { background: #f8ece9; color: var(--warn); border-color: #ead4cf; }
    .chip.due { background: #fbf6ec; color: #8a6a28; border-color: #ead9b4; }
    .chip.missing { background: #f3eee6; color: var(--muted); border-color: var(--line); }
    .name { font-weight: 600; margin: 16px 0 2px; font-size: 16px; }
    .meta { color: var(--muted); font-size: 13px; margin: 0 0 auto; }
    .next { margin-top: 14px; font-size: 13px; color: var(--ink); }
    .work { margin-top: 36px; }
    .class-list { display: grid; gap: 14px; }
    .class-block { padding: 18px 20px 8px; }
    .class-block h3 {
      font-family: Fraunces, Georgia, serif;
      font-size: 22px;
      font-weight: 480;
      margin: 0 0 4px;
      color: var(--navy);
    }
    .class-sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .item {
      display: grid;
      grid-template-columns: 92px 1fr auto;
      gap: 12px;
      align-items: baseline;
      padding: 11px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }
    .item .title { font-weight: 500; }
    .item .due { color: var(--muted); font-size: 13px; }
    @media (max-width: 640px) {
      .item { grid-template-columns: 1fr; gap: 4px; }
    }
    footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
  </style>
</head>

    const who = document.getElementById("who");
    const nameEl = document.getElementById("studentName");
    const updated = document.getElementById("updated");
    const attention = document.getElementById("attention");
    const courses = document.getElementById("courses");
    const work = document.getElementById("work");
    updated.textContent = "Updated " + DATA.updated;
    const STATUS = { overdue: "Overdue", zero: "Zero", due: "Due soon", missing: "Missing" };

    function gradeClass(g) {
      if (g === null || g === undefined) return "none";
      if (g < 70) return "warn";
      if (g >= 90) return "good";
      return "";
    }
    function gradeLabel(g) {
      if (g === null || g === undefined) return "—";
      return (Number.isInteger(g) ? g : g.toFixed(2).replace(/0$/, "")) + "%";
    }
    function render(key) {
      const s = DATA.students[key];
      nameEl.textContent = s.name;
      attention.innerHTML = s.attention.map(t => "<li>" + t + "</li>").join("") || "<li class='quiet'>Nothing flagged.</li>";
      courses.innerHTML = s.courses.map(c => `
        <article class="course">
          <div class="course-top">
            <div class="grade ${gradeClass(c.grade)}">${gradeLabel(c.grade)}</div>
            <span class="chip ${c.source === "Ethos" ? "ethos" : ""}">${c.source}</span>
          </div>
          <p class="name">${c.name}</p>
          <p class="meta">${c.period} · ${c.teacher}</p>
          <p class="next">${c.note}</p>
        </article>
      `).join("");
      const withWork = s.courses.filter(c => c.work && c.work.length);
      work.innerHTML = withWork.length ? withWork.map(c => `
        <article class="class-block">
          <h3>${c.name}</h3>
          <p class="class-sub">${c.source} · ${c.teacher}</p>
          ${c.work.map(w => `
            <div class="item">
              <span class="chip ${w.status}">${STATUS[w.status] || w.status}</span>
              <span class="title">${w.title}${w.detail ? " · " + w.detail : ""}</span>
              <span class="due">${w.due || ""}</span>
            </div>
          `).join("")}
        </article>
      `).join("") : "<p class='quiet'>No assignments flagged.</p>";
    }
    const PATH = { olen: "a", sky: "b" };
    const SLUG = { a: "olen", b: "sky" };
    function recapBase() {
      const p = location.pathname.replace(/\/index\.html$/, "").replace(/\/(a|b)\/?$/, "");
      return (p || "") + "/";
    }
    function fromUrl() {
      const p = location.pathname.replace(/\/index\.html$/, "");
      if (/\/b\/?$/.test(p)) return "sky";
      if (/\/a\/?$/.test(p)) return "olen";
      return "olen";
    }
    function go(key) {
      const next = recapBase() + PATH[key] + "/";
      if (location.pathname.replace(/\/index\.html$/, "").replace(/\/?$/, "/") === next) {
        render(key);
        return;
      }
      location.href = next;
    }
    who.value = fromUrl();
    render(who.value);
    if (!/\/(a|b)\/?$/.test(location.pathname.replace(/\/index\.html$/, ""))) {
      history.replaceState(null, "", recapBase() + PATH[who.value] + "/");
    }
    who.addEventListener("change", () => go(who.value));
